name: BATS Tests
run-name: |
  BATS: ${{
    github.event_name == 'pull_request' && format('PR #{0} by @{1} - {2}', github.event.pull_request.number, github.actor, github.event.pull_request.title) ||
    github.event_name == 'push' && github.event.head_commit && format('Push by @{0} - {1}', github.actor, github.event.head_commit.message) ||
    format('{0} triggered by @{1}', github.event_name, github.actor)
  }}

on:
  push:
    branches:
      - main
    paths:
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/tests.yml"
      # ci-release-job.bats asserts on the release job's structure,
      # workflow-node-floor.bats on the Node floor of both, and
      # triage-workflow-hardening.bats on the triage posture.
      - ".github/workflows/ci.yml"
      - ".github/workflows/issue-triage-v2.yml"
      # triage-classify-vocabulary.bats asserts on the classifier's
      # prompt and schema alongside the workflow that feeds them.
      - ".claude/scripts/prompts/**"
      - ".claude/scripts/schemas/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # triage-classify-vocabulary.bats intersects the label names the
  # triage pipeline still hardcodes against the repo's live label set,
  # so a rename reds here instead of silently degrading a prompt
  # (#867). Read-only, and the only API call the suite makes.
  issues: read

concurrency:
  group: bats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bats:
    name: BATS unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install BATS and Node.js
        run: |
          sudo apt-get update
          sudo apt-get install -y bats nodejs

      - name: Run BATS test suite
        env:
          # Scoped to this step: `gh label list` is the whole use, and
          # the suite runs fork-authored code on pull_request. The test
          # names the canonical repo itself (a fork's label set is not
          # the vocabulary), so no GH_REPO here.
          GH_TOKEN: ${{ github.token }}
        # Cowork tests load scripts/cowork-fallback/cowork-vm-service.js
        # via `node` — the `nodejs` install above is what they need.
        # The cowork-fallback suites cover the bwrap fallback daemon and
        # its asar patch, which now ship in every package (they were
        # exempt while the code shipped in no artifact).
        run: |
          bats --print-output-on-failure \
            tests/*.bats scripts/cowork-fallback/tests/*.bats

      - name: Chromium switch-list smoke
        # Fails if the launcher's effective Chromium switch list drifts
        # from tools/chromium-switches.baseline without a deliberate
        # update (every upstream bump / launcher PR is checked).
        run: ./tools/chromium-switch-smoke.sh
