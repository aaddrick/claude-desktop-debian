---
name: Shellcheck
run-name: |
  Shellcheck: ${{
    github.event_name == 'pull_request' && format('PR #{0} by @{1} - {2}', github.event.pull_request.number, github.actor, github.event.pull_request.title) ||
    github.event_name == 'push' && github.event.head_commit && format('Push by @{0} - {1}', github.actor, github.event.head_commit.message) ||
    format('{0} triggered by @{1}', github.event_name, github.actor)
  }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: Check shell scripts
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install dependencies
        run: |
          sudo apt update && sudo apt install -y shellcheck
      # Every tracked *.sh, not just those with a shebang: -x follows
      # build.sh's source lines but reports nothing inside a followed
      # file, so a sourced module is only checked when named here. A
      # module without a shebang needs `# shellcheck shell=bash` on
      # line 1, or this step fails with SC2148.
      - name: shellcheck
        run: |
          git ls-files -- '*.sh' | xargs shellcheck -x
