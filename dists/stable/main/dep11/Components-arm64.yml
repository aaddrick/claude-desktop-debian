Name:
  C: Claude Desktop
Summary:
  C: Unofficial desktop client for Claude AI
Description:
  C: >-
    <p>
          Claude Desktop is an unofficial community repackaging of Anthropic's
          official Claude Desktop for Linux. It ships the same application as
          .deb and .rpm packages, an AppImage, and a Nix flake, with a
          launcher that adds fixes for Linux desktop environments and a
          built-in --doctor diagnostic.
        </p>
    <p>Features:</p>

    <ul><li>Conversations with the Claude model family (Sonnet, Opus, Haiku)</li><li>Projects with persistent context and
    file uploads</li><li>Cowork mode — local agent VM for sandboxed code tasks</li><li>MCP (Model Context Protocol) stdio
    servers for tool integration</li><li>System tray, Quick Entry hotkey, and tab system</li></ul>

    <p>
          This packaging is community-maintained and is not affiliated with or
          endorsed by Anthropic. See the packaging source and issue tracker
          linked below.
        </p>
